# Controle 8 (monitoramento): confere todo dia se o zethic.net está no ar, se o conteúdo
# publicado é igual ao do repositório e se os endereços de contato levam aos destinos certos.
# Se algo falhar, a execução fica vermelha e o GitHub avisa por e-mail.
name: Vigia do site
on:
  # PAUSADO em 11/10/2026: a conta da organização está bloqueada por cobrança e toda execução falha.
  # Para religar, troque este bloco por:
  #   schedule:
  #     - cron: "17 11 * * *"   # todo dia às 8h17 de Brasília
  #   workflow_dispatch:
  #   push:
  #     branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir o site publicado
        env:
          ESPERAR: ${{ github.event_name == 'push' && '600' || '0' }}
        run: bash _tests/vigia.sh
