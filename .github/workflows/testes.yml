# Controle 6 (gestão de mudanças): roda os testes do site em cada PR e em cada envio ao main.
name: Testes do site
on:
  # PAUSADO em 11/10/2026: a conta da organização está bloqueada por cobrança e toda execução falha.
  # Para religar, troque este bloco por:
  #   pull_request:
  #   push:
  #     branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes estáticos
        run: node --test _tests/*.static.test.mjs
